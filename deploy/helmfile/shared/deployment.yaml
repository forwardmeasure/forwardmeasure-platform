# Operator-owned deployment choices. Environment overrides take precedence; omitted keys use
# the resolver's defaults. This file contains no credentials or image versions.
framework: quarkus
engine: kafka-streams
enableFde: true
displayName: kriyagentic
namespaceLayout: standard

# Keep the existing cluster addressable until its explicit namespace cutover is completed.
# Remove this override after following docs/deployment-configuration-and-cutover.md.
environments:
  gcp-openworkflow-prod:
    namespaceLayout: legacy
