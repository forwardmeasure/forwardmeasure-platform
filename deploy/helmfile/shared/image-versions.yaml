# Image pins used by more than one repository - see common.yaml.gotmpl's header.
# scripts/sync-image-digests.sh fills/refreshes every digest of ours (docker.io/forwardmeasure/...)
# on each install-platform.sh run, including an empty one, and fails the install if one can't be
# resolved; a third-party entry left at digest: "" floats by tag. repository always includes the
# registry.
imageVersions:
  # Cloud SQL Auth Proxy sidecar - Keycloak/Superset (this repository), every openworkflow-service
  # and migrations release (forwardmeasure-openworkflow), and decision-engine.
  cloudSqlProxy:
    repository: gcr.io/cloud-sql-connectors/cloud-sql-proxy
    tag: "2.25.3"
    digest: sha256:bbed57264fe9215e3a20d5d9110cad46ed96f8926ff938c5517f4bc629dd2179
  # forwardmeasure-data-streaming's kafka-streams executor - launched by data-streaming's own
  # launcher and by entity-intelligence's ingestion service.
  dataStreamingExecutorKafkaStreams:
    repository: docker.io/forwardmeasure/data-streaming-executor-kafka-streams
    tag: "1.1.0"
    digest: "sha256:1405ce25c6f33d56a4ff8716eacda05eb46f05fb92f2f5c1b839c9fa41fe5d70"
  # forwardmeasure-openworkflow's workflow publisher - run by every product's workflow bundle
  # (helm-charts' openworkflow-workflow-bundle chart) to publish its workflows into each tenant.
  openworkflowWorkflowPublisher:
    repository: docker.io/forwardmeasure/openworkflow-workflow-publisher
    tag: "1.1.0"
    digest: "sha256:bf137b422271b81a8f38ef11310f5d99d98462b398e9233436ee9d05ebee0b7d"
