# Copy to a private environment file and replace every placeholder. This file
# intentionally contains no credentials; all secret values reside in Google
# Secret Manager and are referenced by name from environments/base.yaml.gotmpl.
platform:
  domain: new-platform.example

gcp:
  projectId: forwardmeasure-production
  region: us-central1
  clusterName: forwardmeasure-production
  dnsServiceAccountEmail: cert-manager@forwardmeasure-production.iam.gserviceaccount.com
  externalSecretsServiceAccountEmail: external-secrets@forwardmeasure-production.iam.gserviceaccount.com
  modelServiceAccountEmail: model-serving@forwardmeasure-production.iam.gserviceaccount.com
  modelCacheBucket: forwardmeasure-production-model-cache
  # Required by releases/keycloak/gcp/base.yaml.gotmpl and releases/superset/gcp/base.yaml.gotmpl -
  # both dot-access these unconditionally (no safe default), so a real cluster bootstrapped from
  # this template must replace them before those two releases will render, same as every other
  # placeholder in this file. Confirmed missing here (2026-09-16) via a real `helmfile template`
  # render - this file previously had no way to reach either release without erroring.
  keycloakServiceAccountEmail: keycloak@forwardmeasure-production.iam.gserviceaccount.com
  keycloakCloudSqlInstance: replace-with-keycloak-cloud-sql-instance
  supersetServiceAccountEmail: superset@forwardmeasure-production.iam.gserviceaccount.com

gateway:
  loadBalancerIp: 203.0.113.10
  rootHost: platform.new-platform.example
  tenantHost: "*.new-platform.example"
  authHost: auth.new-platform.example
  registryHost: registry.new-platform.example
  searchHost: search.new-platform.example
  analyticsHost: analytics.new-platform.example
  # Must be set here, not left to base.yaml.gotmpl's own studioHost - each
  # environment file has its own scoped $domain, so base's studioHost would
  # otherwise render with base's own placeholder domain, not this cluster's.
  studioHost: studio.new-platform.example
  acmeEmail: platform-owner@new-platform.example

# openworkflowRuntimeDatabasePassword/openworkflowAdministratorDatabasePassword are deliberately
# NOT declared in base.yaml.gotmpl - their real Secret Manager names are keyed on
# openworkflow-k8s-setup's Terraform `var.name` (per-cluster, not a fixed platform-wide
# convention), so every real cluster environment must declare its own pair here, matching
# gcp-openworkflow-prod.yaml.gotmpl's identical block. Missing this causes platform-secrets'
# openworkflow-identity-credentials ExternalSecret to fail to render outright (confirmed the hard
# way: this file had no secretStore block at all before, so its very first real use would have
# failed at the platform-secrets release step, not just deployed with wrong values).
secretStore:
  remoteKeys:
    openworkflowRuntimeDatabasePassword: platform-openworkflow-database-password
    openworkflowAdministratorDatabasePassword: platform-openworkflow-database-administrator-password

bootstrapIdentity:
  tenantHost: example-bank.new-platform.example
  tenantDid: did:web:example-bank.new-platform.example
  actorDid: did:web:example-bank.new-platform.example:actors:platform-admin
  actorType: HUMAN

tenants:
  - host: example-bank.new-platform.example
    did: did:web:example-bank.new-platform.example
    code: example-bank
    name: Example Bank

# helmfile values merging replaces lists wholesale, not per-element - if this
# cluster also deploys forwardmeasure-openworkflow, copy base.yaml.gotmpl's
# "openworkflow" identity.serviceClients entry into this list too, or it'll
# be silently dropped for this cluster (confirmed the hard way against the
# real gcp-openworkflow-prod cluster - same fix applied there).
identity:
  serviceClients:
    - clientId: example-bank-operation-adapter
      name: Example Bank Operation Adapter
      secretKey: EXAMPLE_BANK_OPERATION_ADAPTER_CLIENT_SECRET
      secretRemoteKey: platform-example-bank-operation-adapter-client-secret
      realmRoles: [workflow-internal]
      audiences: [entity-intelligence-internal]
      claims:
        tenant_did: did:web:example-bank.new-platform.example
        actor_did: did:web:example-bank.new-platform.example:actors:operation-adapter
        actor_type: SERVICE
