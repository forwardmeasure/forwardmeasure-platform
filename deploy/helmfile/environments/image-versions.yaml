imageVersions:
  # Custom image (official quay.io/keycloak/keycloak:26.7.4 + the real "organization-role" Policy
  # Provider baked in - helm-charts/charts/keycloak-helm-chart/policy-provider) replacing the bare
  # official image - without it, no role granted via Keycloak Organizations-group membership is
  # usable by any built-in Authorization Services policy type, confirmed live. Built via that
  # chart's own build-and-push-image.sh, which derives the Keycloak version from the chart's own
  # values.yaml `keycloakVersion` (currently 26.7.4) - keep this tag in sync with that value.
  # Pushed 2026-09-20; digest confirmed live via `docker buildx imagetools inspect` against the
  # real registry, not copied from a local build.
  keycloak:
    repository: docker.io/forwardmeasure/keycloak
    tag: "26.8.1-authz"
    digest: "sha256:64c47e576176e87067f3475f2c0ed5f051e7a7325066480c9e1c05a2a989dd84"
    pullPolicy: IfNotPresent
  # Bakes in psycopg2-binary/authlib at build time (data-fabric-devops-utils/
  # docker-images/superset) - see releases/superset/base.yaml.gotmpl's own
  # comment for why this replaces the stock apache/superset image.
  # Pinned by digest like every image of ours (sync-image-digests.sh fills it).
  # GKE's Docker Hub pull-through mirror once served a stale manifest for this
  # tag across two re-pushes (imagePullPolicy: Always didn't help - the mirror,
  # not kubelet, was stale); a digest can't be stale. The upstream chart only
  # renders repository:tag, so releases/superset passes "<tag>@<digest>" as its
  # tag.
  # Stock opensearchproject/opensearch:3.8.0 plus the analysis-phonetic, analysis-icu and
  # mapper-size plugins (data-fabric-devops-utils/docker-images/opensearch). Required: FEI's and
  # FDS's reference-population index settings use the phonetic double-metaphone name filter, and
  # the stock image refuses those indices ("Unknown filter type [phonetic]"). Pinned by digest
  # (sync-image-digests.sh fills it); the upstream chart renders repository:tag only, so
  # releases/opensearch-cluster passes "<tag>@<digest>" as its tag, as releases/superset does.
  openSearch:
    repository: docker.io/forwardmeasure/opensearch
    tag: "3.8.0"
    digest: "sha256:87d1636899f632f2110d912973c226a80a09eccb680ffac83e0cbc40b5f5c05a"
    pullPolicy: IfNotPresent
  superset:
    repository: docker.io/forwardmeasure/superset
    tag: "6.1.0"
    digest: "sha256:920971d09860033c2e1d10b4b2684004a23b7863382034d3a6edbff8ed161aef"
    pullPolicy: Always
  platformDashboard:
    # Quarkus specifically - deploy/helmfile/charts/platform-dashboard's
    # deployment.yaml only wires QUARKUS_CONFIG_LOCATIONS, not the Spring/
    # Micronaut equivalents. Was unsuffixed and shared with the spring/
    # micronaut bindings below it - confirmed the hard way: all three publish
    # to the same tag by default, so whichever framework's module built last
    # in the reactor silently overwrote whatever the others had just pushed,
    # and the chart kept deploying that (usually mismatched) image with no
    # error until the pod crashed on a config placeholder the wrong
    # framework doesn't set.
    repository: docker.io/forwardmeasure/forwardmeasure-platform-operations-quarkus
    tag: "1.0.0"
    digest: sha256:5d8d71e984c384755416623d1f31acb9c48fe280078bb003dd8bb57fa2110c52
    pullPolicy: Always
  modelUtilities:
    repository: docker.io/forwardmeasure/ml-model-utilities
    tag: latest
    digest: sha256:eb705101bf88908ead1ed129580406b72570fbd76fadbbcf38912714b35034de
    pullPolicy: IfNotPresent
  # cloudSqlProxy (keycloak, superset) is pinned in ../shared/image-versions.yaml - shared with
  # forwardmeasure-openworkflow and forwardmeasure-decision-engine.
  # apicurio-registry-operator-helm-chart bakes these into its own
  # values.yaml with no consumer override wired up before now - upgrading
  # meant editing helm-charts, bumping its chart version, and publishing,
  # just to change an image tag. Wired through here instead (see
  # releases/apicurio-registry-operator/base.yaml.gotmpl) so every future
  # bump is a one-line change in this repo, no helm-charts touch needed.
  apicurioOperator:
    repository: quay.io/apicurio/apicurio-registry-3-operator
    tag: "3.3.3"
  apicurioRegistryApp:
    repository: quay.io/apicurio/apicurio-registry
    tag: "3.3.3"
  apicurioRegistryUi:
    repository: quay.io/apicurio/apicurio-registry-ui
    tag: "3.3.3"
  apicurioRegistryGitopsSync:
    repository: quay.io/apicurio/apicurio-registry-gitops-sync
    tag: "3.3.3"
  # Upstream OPA project's own Docker Hub org, same as every other
  # third-party image here - not rehosted. Digest confirmed via two
  # independent `docker pull` + `docker inspect` runs (2026-08-28).
  opa:
    repository: docker.io/openpolicyagent/opa
    tag: "1.20.1"
    digest: "sha256:39daf255ae7f25d81103f03a0c18308a50b7b5bb67907bed6166f70e24a970ff"
    pullPolicy: IfNotPresent
