# Cloud-wide GCP layer: values every GCP cluster needs, but not specific to
# any one cluster - real per-cluster values (project ID, GSA emails, Cloud
# SQL instance names) come from a cluster leaf file layered on top of this
# one (e.g. gcp-openworkflow-prod.yaml.gotmpl), matching data-fabric's own
# environments/gcp.yaml. Plain YAML, not .gotmpl - nothing here needs
# templating.
cloudProvider: gcp

gcp:
  projectId: replace-with-gcp-project
  region: us-central1
  clusterName: replace-with-gke-cluster
  dnsServiceAccountEmail: replace-with-dns-sa@example.iam.gserviceaccount.com
  externalSecretsServiceAccountEmail: replace-with-external-secrets-sa@example.iam.gserviceaccount.com
  modelServiceAccountEmail: replace-with-model-sa@example.iam.gserviceaccount.com
  modelCacheBucket: replace-with-model-cache-bucket
  keycloakServiceAccountEmail: replace-with-keycloak-sa@example.iam.gserviceaccount.com
  keycloakCloudSqlInstance: replace-with-keycloak-cloud-sql-instance

gateway:
  clusterIssuer: letsencrypt-gcp-dns
