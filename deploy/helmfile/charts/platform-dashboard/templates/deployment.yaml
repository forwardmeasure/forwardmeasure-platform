apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-dashboard.name" . }}
  labels:
    {{- include "platform-dashboard.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels:
      {{- include "platform-dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "platform-dashboard.selectorLabels" . | nindent 8 }}
        forwardmeasure.com/platform-dashboard: "true"
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "platform-dashboard.name" . }}
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: dashboard
          image: {{ include "platform-dashboard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: QUARKUS_CONFIG_LOCATIONS, value: /etc/forwardmeasure/application-deployment.yaml}
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          readinessProbe: {httpGet: {path: /q/health/ready, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /q/health/live, port: http}, initialDelaySeconds: 15, periodSeconds: 15}
          startupProbe: {httpGet: {path: /q/health/ready, port: http}, failureThreshold: 30, periodSeconds: 5}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /etc/forwardmeasure, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: {{ include "platform-dashboard.name" . }}}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
