{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "platform-dashboard.name" . }}
  labels:
    {{- include "platform-dashboard.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gatewayName }}
      namespace: {{ .Values.route.gatewayNamespace }}
      sectionName: {{ .Values.route.listenerName }}
  hostnames: [{{ .Values.route.hostname | quote }}]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /platform}
      backendRefs:
        - name: {{ include "platform-dashboard.name" . }}
          port: 8080
{{- end }}
