image:
  repository: docker.io/forwardmeasure/forwardmeasure-platform-operations
  tag: 1.0.0
  digest: ""
  pullPolicy: IfNotPresent
imagePolicy:
  requireDigest: false
imagePullSecrets: []
replicaCount: 2
autoscaling: {enabled: true, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70}
resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 768Mi}}
oidc:
  url: https://auth.example.invalid
  issuer: https://auth.example.invalid/realms/example
  realm: example
  clientId: example-public
  audience: platform-dashboard
tenants:
  - host: tenant.example.com
    did: did:web:tenant.example.com
    name: example
    displayName: Example Tenant
applications: []
environment: Production
probeTimeout: PT2S
observationTtl: PT10S
components: []
route: {enabled: false, gatewayName: platform-gateway, gatewayNamespace: istio-system, listenerName: tenant-https, hostname: "*.example.com"}
