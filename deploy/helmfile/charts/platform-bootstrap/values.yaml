certificates:
  enabled: false
  issuer:
    name: letsencrypt-gcp-dns
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform-owner@example.com
    gcpProject: replace-with-gcp-project
  keycloak:
    namespace: keycloak
    host: auth.example.com
    secretName: keycloak-server-tls
  gateway:
    namespace: istio-system
    rootHost: platform.example.com
    rootSecret: platform-root-tls
    # Per-tenant SANs for the tenant-https listener's certificate -
    # deliberately NOT a "*.example.com" wildcard: a wildcard here would be
    # cryptographically valid for every other single-label host under the
    # same domain (auth, registry, search, analytics, the root platform
    # host), each of which already has its own dedicated, non-wildcard
    # certificate specifically so they're isolated from each other. A shared
    # wildcard cert lets a browser silently reuse (HTTP/2 connection
    # coalescing) an already-open tenant connection for a request to one of
    # those other hosts, landing on the tenant listener's route table -
    # which has no route for it - instead of opening a fresh, correctly
    # SNI-routed connection. Confirmed the hard way via a HAR capture: a
    # real browser's request to auth.<domain> came back a bare, routeless
    # 404 (no upstream-service-time header at all) purely because it reused
    # a connection still open from the tenant page, even though every
    # hand-crafted request to the identical URL succeeded. The tenant-https
    # *listener*'s own hostname match stays a wildcard pattern below
    # (gateway.tenantHost) - that only controls which SNI values get routed
    # to this listener at all, not what the certificate is valid for, so
    # onboarding a new tenant still needs no listener change, only adding
    # its host here.
    tenantHosts: ["example.com"]
    tenantSecret: platform-tenant-tls

kafkaTopics:
  enabled: false
  namespace: kafka
  clusterName: kafka-cluster
  partitions: 12
  replicas: 3
  # Each entry: {name, config: {}, partitions: (defaults to above),
  # replicas: (defaults to above)}.
  topics: []

gateway:
  enabled: false
  name: platform-gateway
  namespace: istio-system
  className: istio
  replicaCount: 2
  loadBalancerIp: 192.0.2.10
  rootHost: platform.example.com
  rootSecret: platform-root-tls
  tenantHost: "*.example.com"
  tenantSecret: platform-tenant-tls
  listeners: []
