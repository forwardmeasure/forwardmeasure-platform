{{- if and .Values.gateway.enabled (eq .Values.gateway.className "istio") }}
{{- range .Values.gateway.listeners }}
{{- if .preserveRequestId }}
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: {{ printf "%s-%s-request-id" $.Values.gateway.name .name }}
  namespace: {{ $.Values.gateway.namespace }}
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: {{ $.Values.gateway.name | quote }}
  configPatches:
    - applyTo: NETWORK_FILTER
      match:
        context: GATEWAY
        listener:
          portNumber: 443
          filterChain:
            sni: {{ .hostname | quote }}
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: MERGE
        value:
          name: envoy.filters.network.http_connection_manager
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            preserve_external_request_id: true
            request_id_extension:
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.request_id.uuid.v3.UuidRequestIdConfig
                # Envoy otherwise encodes tracing flags into caller-provided UUIDs.
                pack_trace_reason: false
                use_request_id_for_trace_sampling: false
{{- end }}
{{- end }}
{{- end }}
