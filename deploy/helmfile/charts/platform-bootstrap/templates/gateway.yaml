{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.gateway.name }}-options
  namespace: {{ .Values.gateway.namespace }}
data:
  deployment: |
    spec:
      replicas: {{ .Values.gateway.replicaCount }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.gateway.namespace }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  infrastructure:
    parametersRef: {group: "", kind: ConfigMap, name: {{ .Values.gateway.name }}-options}
  addresses:
    - {type: IPAddress, value: {{ .Values.gateway.loadBalancerIp | quote }}}
  listeners:
    - name: root-http
      hostname: {{ .Values.gateway.rootHost | quote }}
      port: 80
      protocol: HTTP
      allowedRoutes: {namespaces: {from: All}}
    - name: tenant-http
      hostname: {{ .Values.gateway.tenantHost | quote }}
      port: 80
      protocol: HTTP
      allowedRoutes: {namespaces: {from: All}}
    - name: root-https
      hostname: {{ .Values.gateway.rootHost | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs: [{kind: Secret, name: {{ .Values.gateway.rootSecret }}}]
      allowedRoutes: {namespaces: {from: All}}
    - name: tenant-https
      hostname: {{ .Values.gateway.tenantHost | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs: [{kind: Secret, name: {{ .Values.gateway.tenantSecret }}}]
      allowedRoutes: {namespaces: {from: All}}
    {{- range .Values.gateway.listeners }}
    - name: {{ .name }}-http
      hostname: {{ .hostname | quote }}
      port: 80
      protocol: HTTP
      allowedRoutes: {namespaces: {from: All}}
    - name: {{ .name }}
      hostname: {{ .hostname | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs: [{kind: Secret, name: {{ .tlsSecret }}}]
      allowedRoutes: {namespaces: {from: All}}
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform-root-http-redirect
  namespace: {{ .Values.gateway.namespace }}
spec:
  parentRefs: [{name: {{ .Values.gateway.name }}, sectionName: root-http}]
  hostnames: [{{ .Values.gateway.rootHost | quote }}]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, port: 443, statusCode: 301}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform-tenant-http-redirect
  namespace: {{ .Values.gateway.namespace }}
spec:
  parentRefs: [{name: {{ .Values.gateway.name }}, sectionName: tenant-http}]
  hostnames: [{{ .Values.gateway.tenantHost | quote }}]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, port: 443, statusCode: 301}
{{- range .Values.gateway.listeners }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}-http-redirect
  namespace: {{ $.Values.gateway.namespace }}
spec:
  parentRefs: [{name: {{ $.Values.gateway.name }}, sectionName: {{ .name }}-http}]
  hostnames: [{{ .hostname | quote }}]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, port: 443, statusCode: 301}
{{- end }}
{{- end }}
