{{- if .Values.certificates.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.certificates.issuer.name }}
spec:
  acme:
    server: {{ .Values.certificates.issuer.server }}
    email: {{ .Values.certificates.issuer.email }}
    privateKeySecretRef:
      name: {{ .Values.certificates.issuer.name }}-account-key
    solvers:
      - dns01:
          cloudDNS:
            project: {{ .Values.certificates.issuer.gcpProject }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-server
  namespace: {{ .Values.certificates.keycloak.namespace }}
spec:
  secretName: {{ .Values.certificates.keycloak.secretName }}
  issuerRef: {name: {{ .Values.certificates.issuer.name }}, kind: ClusterIssuer}
  dnsNames: [{{ .Values.certificates.keycloak.host | quote }}]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-root
  namespace: {{ .Values.certificates.gateway.namespace }}
spec:
  secretName: {{ .Values.certificates.gateway.rootSecret }}
  issuerRef: {name: {{ .Values.certificates.issuer.name }}, kind: ClusterIssuer}
  dnsNames: [{{ .Values.certificates.gateway.rootHost | quote }}]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-tenants
  namespace: {{ .Values.certificates.gateway.namespace }}
spec:
  secretName: {{ .Values.certificates.gateway.tenantSecret }}
  issuerRef: {name: {{ .Values.certificates.issuer.name }}, kind: ClusterIssuer}
  dnsNames: [{{ .Values.certificates.gateway.tenantHost | quote }}]
{{- end }}
