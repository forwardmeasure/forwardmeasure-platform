quarkus:
  application:
    name: forwardmeasure-platform-dashboard
  http:
    host: 0.0.0.0
    root-path: /platform
    non-application-root-path: /q
  oidc:
    auth-server-url: ${PLATFORM_DASHBOARD_OIDC_ISSUER}
    client-id: ${PLATFORM_DASHBOARD_OIDC_CLIENT_ID}
    application-type: service
    token:
      audience: ${PLATFORM_DASHBOARD_OIDC_AUDIENCE:platform-dashboard-api}
  micrometer:
    export:
      prometheus:
        path: /q/metrics

forwardmeasure:
  platform:
    dashboard:
      oidc-url: ${PLATFORM_DASHBOARD_OIDC_URL}
      oidc-realm: ${PLATFORM_DASHBOARD_OIDC_REALM}
      oidc-client-id: ${PLATFORM_DASHBOARD_OIDC_CLIENT_ID}
      environment: ${PLATFORM_DASHBOARD_ENVIRONMENT:Production}
      probe-timeout: ${PLATFORM_DASHBOARD_PROBE_TIMEOUT:PT2S}
      observation-ttl: ${PLATFORM_DASHBOARD_OBSERVATION_TTL:PT10S}
