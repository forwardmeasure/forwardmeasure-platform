name: Platform Verification

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - develop

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check Out Platform
        uses: actions/checkout@v4
        with:
          path: forwardmeasure-platform

      - name: Check Out Testcontainers
        uses: actions/checkout@v4
        with:
          repository: forwardmeasure/forwardmeasure-testcontainers
          ref: develop
          path: forwardmeasure-testcontainers

      - name: Check Out Database Migrations
        uses: actions/checkout@v4
        with:
          repository: forwardmeasure/forwardmeasure-database-migrations
          ref: develop
          path: forwardmeasure-database-migrations

      - name: Check Out JPA
        uses: actions/checkout@v4
        with:
          repository: forwardmeasure/forwardmeasure-jpa
          ref: develop
          path: forwardmeasure-jpa

      - name: Check Out Object Storage
        uses: actions/checkout@v4
        with:
          repository: forwardmeasure/forwardmeasure-object-storage
          ref: develop
          path: forwardmeasure-object-storage

      - name: Check Out NLP
        uses: actions/checkout@v4
        with:
          repository: forwardmeasure/forwardmeasure-nlp
          ref: develop
          path: forwardmeasure-nlp

      - name: Check Out Entity Matching
        uses: actions/checkout@v4
        with:
          repository: forwardmeasure/forwardmeasure-entity-matching
          ref: develop
          path: forwardmeasure-entity-matching

      - name: Check Out OpenWorkflow
        uses: actions/checkout@v4
        with:
          repository: forwardmeasure/forwardmeasure-openworkflow
          ref: develop
          path: forwardmeasure-openworkflow

      - name: Check Out Platform Operations
        uses: actions/checkout@v4
        with:
          repository: forwardmeasure/forwardmeasure-platform-operations
          ref: develop
          path: forwardmeasure-platform-operations

      - name: Set Up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build Complete Open-Source Reactor
        run: mvn -B clean verify
        working-directory: forwardmeasure-platform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
